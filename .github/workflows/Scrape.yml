# Daily scrape + curate. Commits fresh Data/ and Images/ back to main.

name: Scrape

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run scraper
        working-directory: ./Scraper
        run: go run .

      - name: Run curate
        working-directory: ./Curate
        run: go run .

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "bsrdata-bot"
          git config user.email "bsrdata-bot@users.noreply.github.com"
          git add Data Images
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): daily refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Tell the site repo to rebuild + redeploy immediately so the refreshed
      # data goes live within minutes. A commit pushed with the default
      # GITHUB_TOKEN does NOT trigger the site's `on: push` / this repo's
      # Notify.yml, so we dispatch explicitly here. Requires a repo secret
      # SITE_DISPATCH_TOKEN: a PAT with "contents: write" (classic repo scope)
      # or a fine-grained PAT with Contents: read/write on the
      # AureliusGilchrist/TheAdnyeusArchive repo.
      - name: Notify site to deploy
        if: steps.commit.outputs.changed == 'true' && env.SITE_DISPATCH_TOKEN != ''
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/AureliusGilchrist/TheAdnyeusArchive/dispatches" \
            -d '{"event_type":"bsrdata-updated"}'
          echo "Dispatched bsrdata-updated to the site repo."
