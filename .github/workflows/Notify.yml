# Notify the site to redeploy whenever BSRData's data changes on a push.
#
# This redeploys the site's STAGING build (which tracks the latest BSRData) so
# data changes are previewable within minutes. It does NOT promote anything to
# the live/stable site — that only happens when Promote.yml moves the stable
# pin, by hand.
#
# This covers MANUAL / human pushes to BSRData (e.g. hand-edited JSON). The
# automated scheduled scrape commits with the default GITHUB_TOKEN, and GitHub
# deliberately does NOT trigger `on: push` workflows for token-made commits to
# avoid recursion — so that path dispatches from Scrape.yml's own "Notify site
# to deploy" step instead.
#
# Requires a repo secret SITE_DISPATCH_TOKEN: a PAT with "contents: write"
# (classic repo scope) or a fine-grained PAT with Contents: read/write on the
# AureliusGilchrist/TheAdnyeusArchive repo.

name: Notify Site

on:
  push:
    branches: [main]
    # An IGNORE list, deliberately, not an allow list. This was an allow list of
    # 'Data/**', 'Images/**' and 'Contributors/**' — written when characters,
    # banners and teams all still lived under Data/. The restructure moved them
    # to Characters/<year>/, Banners/<year>/ and Teams/<group>/, and the filter
    # was never updated, so every hand-edit to a character, banner or team
    # pushed to main silently matched nothing and the beta site was never told
    # to rebuild. Data/ has held only Glossary.json since.
    #
    # Listing what CANNOT affect the served data fails safe: a new data folder
    # is covered the day it is added, and the worst case is a redundant staging
    # rebuild rather than a beta site that quietly serves stale JSON.
    paths-ignore:
      - '.github/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-site
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to site repo
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set — skipping site dispatch."
            echo "Add it under Settings → Secrets and variables → Actions to enable auto-deploy."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/AureliusGilchrist/TheAdnyeusArchive/dispatches" \
            -d '{"event_type":"bsrdata-updated"}'
          echo "Dispatched bsrdata-updated to the site repo."
